# GitLab CI/CD Pipeline for AI Medical Record Extractor
# This file configures automated testing, building, and deployment

# Define stages
stages:
  - test
  - build
  - deploy

# Global variables
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  APP_NAME: "medical-extractor"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

# Cache dependencies
cache:
  paths:
    - .pytest_cache
    - frontend/node_modules/
    - venv/

# Test Stage
test-backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y tesseract-ocr
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-asyncio httpx
  script:
    - pytest tests/ -v --tb=short
  coverage: '/TOTAL\s+\d+\%\s+\d+$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - merge_requests
    - main
    - develop

test-frontend:
  stage: test
  image: node:18-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint
    - npm run build
  only:
    - merge_requests
    - main
    - develop

# Build Stage
build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  only:
    - main
    - develop
  when: manual

build-frontend:
  stage: build
  image: node:18-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
  only:
    - main
    - develop
  when: manual

# Deploy Stage
deploy-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging environment..."
    - ssh $SSH_USER@$SSH_HOST "cd /opt/medical-extractor-staging && git pull"
    - ssh $SSH_USER@$SSH_HOST "cd /opt/medical-extractor-staging && docker-compose pull"
    - ssh $SSH_USER@$SSH_HOST "cd /opt/medical-extractor-staging && docker-compose up -d"
    - ssh $SSH_USER@$SSH_HOST "cd /opt/medical-extractor-staging && ./health-check.sh"
  environment:
    name: staging
    url: https://staging.medical-extractor.example.com
  only:
    - develop

deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production..."
    - ssh $SSH_USER@$SSH_HOST "cd /opt/medical-extractor && git pull"
    - ssh $SSH_USER@$SSH_HOST "cd /opt/medical-extractor && ./deploy.sh"
    - ssh $SSH_USER@$SSH_HOST "cd /opt/medical-extractor && ./health-check.sh"
  environment:
    name: production
    url: https://medical-extractor.example.com
  only:
    - main
  when: manual

# Release Stage
create-release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      release-cli create \
        --name "Release $CI_COMMIT_TAG" \
        --description "$(cat RELEASES.md)" \
        --tag-name $CI_COMMIT_TAG \
        --released-at $(date -u +"%Y-%m-%dT%H:%M:%SZ")
  only:
    - tags

# Security Scanning
security-scan:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install bandit safety
  script:
    - bandit -r src/ -f json -o bandit-report.json || true
    - safety check --json || true
  allow_failure: true
  only:
    - main
    - merge_requests

# Performance Testing (optional)
performance-test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install locust
  script:
    - locust -f tests/performance/locustfile.py --headless -u 10 -r 2 --run-time 1m --host=http://localhost:8000 || true
  allow_failure: true
  only:
    - main